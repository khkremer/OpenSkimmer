# Example ka9q-radio radiod config: an RX-888 (mkII) direct-sampling the whole
# HF spectrum at once, split into one wideband IQ channel per HF ham band for
# the OpenSkimmer ka9q backend. Because the RX-888 digitizes 0-32 MHz in one
# ADC, every band below comes from the same device simultaneously -- no tuning,
# no extra hardware. Each band is its own RTP multicast group so a skimmer
# subscribes only to the band(s) it wants.
#
# Install on the radiod host as /etc/radio/radiod@skimmer-rx888.conf, then:
#   sudo systemctl start radiod@skimmer-rx888
#
# THE INSTANCE NAME NEVER INCLUDES ".conf". The unit is radiod@NAME and the
# file is /etc/radio/radiod@NAME.conf -- systemd expands %i to NAME and radiod
# appends the extension itself. Enabling radiod@NAME.conf makes it look for
# radiod@NAME.conf.conf, which does not exist, so it exits at once and systemd
# restarts it about every 5 s FOREVER. That failure is near-silent: nothing
# says "wrong name", the unit just churns. Observed on a live host at restart
# counter 88067 and still climbing -- three days of it. The process dies at
# config load (exit 66/NOINPUT) BEFORE touching the SDR or opening a socket,
# so it does not fight the working instance for the device; the damage is
# ~600k junk journal lines, which makes journalctl crawl and buries the
# entries you are actually looking for. Check with:
#     systemctl list-units 'radiod@*' --all
# and treat any nonzero restart counter as a fault, not as resilience.
# Verify a band with ka9q's own tools (monitor / pcmrecord) or OpenSkimmer's
# tools/rtp_tap.py. Then point OpenSkimmer at whichever bands you want, e.g.:
#   openskimmer --my-call YOURCALL \
#     --band ka9q@skim-20m.local:14050000/192000 \
#     --band ka9q@skim-40m.local:7050000/192000 \
#     --band ka9q@skim-10m.local:28050000/192000
#
# The RX-888 needs a real CPU (a fast multi-core x86 or a Pi 5); the 64.8 Msps
# master FFT is the load, not the per-band channels. Ten channels (nine at
# 192 kHz plus 60 m at 96 kHz) is trivial for radiod once the front-end FFT
# keeps up.

[global]
status = skimmer-rx888.local    # metadata/control multicast domain (mDNS)
hardware = rx888                # -> the [rx888] front-end section below
ttl = 1                         # multicast hop limit; MUST be >=1 or the
                                # streams never leave the radiod host
# fft-threads = 2               # threads for the big front-end FFT; raise on a
                                # busy host if you see input overruns
# iface = lo                    # uncomment to keep the multicast host-local
#
# PIN THE EGRESS INTERFACE if the host has more than one. Multicast leaves by
# whichever interface wins the route, and any interface that comes up on the
# same subnet can take it over -- WiFi, a VPN, a docker/libvirt bridge. That
# happened here: a WiFi interface enabled itself after a reboot and landed on
# the same subnet as the wired bridge, the IQ streams moved onto it, and WiFi
# sends multicast at the lowest basic rate, nowhere near the ~18 Mb/s of three
# 192 kHz channels. Every subscriber starved, local and remote alike, and
# restarting radiod changed nothing because the route was unchanged.
#
# The signature is distinctive, and worth knowing because it looks like an
# overloaded host without being one:
#   - radiod's SEND socket is jammed: `ss -uanm` shows t~=tb on its socket,
#     and `nstat` UdpSndbufErrors climbing hard
#   - the RECEIVE side is perfectly clean: r0/d0, UdpRcvbufErrors 0
#   - CPU is NOT saturated
# Send jammed + receive clean + CPU fine = the packets cannot reach the wire.
# Look at routing and interfaces, not at buffer sizes or the decoder.
#
# iface = br0                   # e.g. pin to the wired bridge by name

[rx888]
device = rx888
description = "OpenSkimmer RX-888 HF"
samprate = 64800000            # ADC rate: Nyquist 32.4 MHz covers 160m-10m.
                               # (129600000 doubles it to reach 6m/50 MHz, but
                               # needs a stronger host + solid USB3.)
gain = 10                      # RF gain, dB. CAUTION: unlike a tuned SDR the
                               # RX-888 sees ALL of HF at once, so every strong
                               # shortwave-broadcast and ham signal sums into
                               # one 16-bit ADC. Keep gain LOW and watch for
                               # radiod's ADC-overload/clip reports; too much
                               # gain overloads on the aggregate power and
                               # sprays intermod across every band (-> phantom
                               # decodes). Start ~10, back off if it clips.
# att = 0                      # front-end attenuator, dB; add attenuation
                               # instead of gain if a strong band overloads
# bias = off                   # HF-port bias tee (DC out for a preamp); leave
                               # off unless you actually power something
# firmware = SDDC_FX3.img      # SDDC firmware the driver uploads; set a path
                               # if it is not found in the default location
# serial = ...                 # pick a specific unit if more than one present

# --- One IQ channel per HF band -----------------------------------------------
# Each is 192 kHz wide (low/high = the output Nyquist, symmetric for a flat
# passband) centered to put the CW segment in the lower half and the FT8/FT4
# digital sub-bands in the upper half. mode = iq starts from the [iq] preset;
# freq is also the RTP SSRC in Hz (28.050 MHz -> SSRC 28050), which OpenSkimmer
# derives from the --band center. Narrow the WARC bands (30/17/12 m) to
# samprate=96000 with low/high +/-48000 if you want to trim their extra edges.

[SKIM-160M]
mode = iq
data = skim-160m.local
freq = 1830000                 # covers 1.734-1.926: CW 1.800-1.840 + FT8 1.840
samprate = 192000
low = -96000
high = 96000

[SKIM-80M]
mode = iq
data = skim-80m.local
freq = 3550000                 # covers 3.454-3.646: CW 3.500-3.570 + FT8 3.573
samprate = 192000
low = -96000
high = 96000

# 60 m is the odd one out. US amateurs have five discrete channels, with CW
# required to be centered on each channel center --
#   5332.0  5348.0  5358.5  5373.0  5405.0 kHz
# -- 73 kHz from the lowest to the highest. The FCC has since ALSO adopted
# the contiguous WRC-15 allocation 5351.5-5366.5 (the band the rest of the
# world already had), at a lower power limit than the channels; 5358.5 falls
# inside it, so the two overlap. Both fit in one 96 kHz channel, and 192 kHz
# would be almost entirely empty -- so this channel is 96 kHz in BOTH config
# variants (unlike the WARC bands, its SSRC is the same in each).
#
# Expect a mix: spots piled on the five exact channel centers, plus spots
# spread across 5351.5-5366.5. The latter will tend to be weaker, since that
# segment carries the more restrictive power limit. Activity is thin either
# way -- 60 m is secondary and carries little CW.
[SKIM-60M]
mode = iq
data = skim-60m.local
freq = 5368000                 # covers 5.320-5.416: all five US channels with
                               # ~12 kHz guard beyond the outermost, plus the
                               # WRC-15 band entire. Deliberately a whole kHz:
                               # the true midpoint 5368.5 would make the SSRC
                               # (round of kHz) ambiguous.
samprate = 96000
low = -48000
high = 48000

[SKIM-40M]
mode = iq
data = skim-40m.local
freq = 7050000                 # covers 6.954-7.146: CW 7.000-7.125 + FT8 7.074
samprate = 192000
low = -96000
high = 96000

[SKIM-30M]
mode = iq
data = skim-30m.local
freq = 10125000                # covers 10.029-10.221: CW 10.100-10.130 + FT8 10.136
samprate = 192000
low = -96000
high = 96000

[SKIM-20M]
mode = iq
data = skim-20m.local
freq = 14050000                # covers 13.954-14.146: CW 14.000-14.150 + FT8 14.074
samprate = 192000
low = -96000
high = 96000

[SKIM-17M]
mode = iq
data = skim-17m.local
freq = 18100000                # covers 18.004-18.196: CW 18.068-18.110 + FT8 18.100
samprate = 192000
low = -96000
high = 96000

[SKIM-15M]
mode = iq
data = skim-15m.local
freq = 21050000                # covers 20.954-21.146: CW 21.000-21.150 + FT8 21.074
samprate = 192000
low = -96000
high = 96000

[SKIM-12M]
mode = iq
data = skim-12m.local
freq = 24925000                # covers 24.829-25.021: CW 24.890-24.930 + FT8 24.915
samprate = 192000
low = -96000
high = 96000

[SKIM-10M]
mode = iq
data = skim-10m.local
freq = 28050000                # covers 27.954-28.146: CW 28.000-28.190 + FT8 28.074
samprate = 192000
low = -96000
high = 96000
