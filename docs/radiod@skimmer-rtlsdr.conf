# Example ka9q-radio radiod config: expose one wideband IQ channel from an
# RTL-SDR as an RTP multicast stream, for the OpenSkimmer ka9q backend POC.
# The same shape works with an RX-888 later -- just swap the front-end
# section and add more channels.
#
# Install on the radiod host as /etc/radio/radiod@skimmer.conf, then:
#   sudo systemctl start radiod@skimmer
# Verify with ka9q's own tools (monitor / pcmrecord) or capture the stream
# with OpenSkimmer's tools/rtp_tap.py.
#
# Band: 10 m (28 MHz). A stock R820T2 dongle tunes ~24 MHz-1.7 GHz, so 10 m
# is NATIVE -- no direct sampling needed. Likely reference signals to look
# for: FT8 at 28.074 MHz (present whenever the band is even marginally open)
# and the IARU beacons around 28.2 MHz. If 10 m is dead, bump the front-end
# frequency and the channel freq to a strong VHF FM broadcast station for a
# guaranteed carrier (the backend doesn't care what band -- this only tests
# the plumbing and the frequency mapping).

[global]
status = skimmer.local          # metadata/control multicast domain (mDNS)
hardware = rtlsdr               # -> the [rtlsdr] front-end section below
ttl = 1                         # multicast hop limit; MUST be >=1 or the
                                # stream never leaves the radiod host (a
                                # different machine won't see it)
# iface = lo                    # uncomment to keep the multicast host-local

[rtlsdr]
device = rtlsdr
description = "OpenSkimmer POC RTL-SDR"
# serial = 00000001            # set if more than one dongle is present
samprate = 2400000             # RTL-SDR ADC rate (~2.4 MHz)
frequency = 28100000           # tuner center; must bracket the channel below
gain = 30                      # tuner gain, dB (R820T2: 0..49.6 in 29 steps,
                               # snapped to nearest). Want just enough that band
                               # noise rises above the receiver floor -- test by
                               # comparing the noise floor antenna-in vs -out.
                               # More than that only wastes the 8-bit ADC's
                               # headroom and invites strong-signal overload
                               # (intermod spurs -> phantom decodes). Typically
                               # 30-40 on HF; back off a step if you see spurs.

[SKIMMER-10M]
mode = iq                      # complex output (starts from the [iq] preset)
data = skimmer-iq.local        # this channel's data multicast group
freq = 28050000                # channel center; also the RTP SSRC (Hz).
                               # Covers 27.954-28.146 with the 192 kHz span:
                               # the 10 m CW segment plus FT8 at 28.074.
# samprate sets the channel's complex output rate = its full IQ width, here
# 192 kHz centered on freq (the preset default is 12k). low/high are the
# filter passband edges in Hz *relative to freq*; everything outside is
# filtered out. For a full-width IQ channel set them to the output Nyquist
# (-samprate/2, +samprate/2), as below. They are independent of samprate and
# may be asymmetric (that is exactly how SSB channels are defined, e.g. USB
# low=50 high=3000) -- but for skimming keep them symmetric for a flat
# edge-to-edge passband; a narrower/offset window just wastes the rest of the
# output width rather than saving it (move freq + shrink samprate instead).
#
# Max width is bounded by: the front-end samprate above (2.4 MHz here, and the
# RTL's usable flat span is less -- stay under ~2 MHz, off the edges); radiod's
# block timing (samprate must give a whole, FFT-friendly sample count per
# block -- 96k/192k/384k/768k and the audio rates all work; 192k off a 2.4 MHz
# front end is fine because the filterbank doesn't need an integer rate ratio);
# and CPU (one inverse FFT per channel per block). To skim wider, e.g. raise
# samprate=384000 with low=-192000/high=192000; narrower, 96000 with +/-48000.
samprate = 192000              # output IQ bandwidth (override the preset 12k)
low = -96000                   # passband edges within the output Nyquist
high = 96000
