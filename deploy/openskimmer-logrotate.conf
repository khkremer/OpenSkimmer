# Rotation for OpenSkimmer's channel word log (LOG_CHANNELS in
# skimmer.local.conf) and char log (LOG_CHARS). Measured on one host
# skimming three bands: the word log is roughly 140 MB/day, the char log 1.4 GB/day
# (about 230 MB gzipped, so seven days kept is ~1.6 GB), and nothing
# truncates either. A path that isn't being logged is skipped (missingok).
#
# Install (replace YOURUSER and the paths below first):
#   sudo cp deploy/openskimmer-logrotate.conf /etc/logrotate.d/openskimmer
#   sudo logrotate -d /etc/logrotate.d/openskimmer     # dry run
#
# copytruncate is REQUIRED here, not a preference. main.py opens each file
# once with open(path, "a") and holds the descriptor for the life of the
# process; there is no reopen on SIGHUP. logrotate's default rename-based
# rotation would therefore leave the skimmer writing to the RENAMED inode
# forever -- the rotated file would keep growing while the log sat
# empty, which looks exactly like rotation working until you read it.
#
# The append mode is what makes copytruncate safe: every write goes to the
# current end of file, so truncation resets the offset cleanly. A log opened
# without O_APPEND would come back as a sparse file null-padded to the old
# offset. The known cost is a small race -- lines written between the copy
# and the truncate are lost. That is acceptable for a diagnostic log and is
# not acceptable for anything you intend to count exactly.
#
# su is needed because the log lives in a user-writable directory, which
# logrotate refuses to act on otherwise.

/home/YOURUSER/openskimmer/log-channels.txt /home/YOURUSER/openskimmer/log-chars.txt {
    daily
    rotate 7
    compress
    missingok
    notifempty
    copytruncate
    su YOURUSER YOURUSER
}
